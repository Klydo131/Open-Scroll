name: An idea for Open Scroll
description: Suggest something that would help your church plan.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the need in your church's words, before any solution.
    validations:
      required: true
  - type: dropdown
    id: tradition
    attributes:
      label: Which tradition do you plan for?
      options: [Seventh-day Adventist, Another church tradition]
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
